services:
  - type: web
    name: imobiliario-luanda
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Chamada de voz em redes restritivas (opcional): conta grátis em metered.ca
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
