services:
  - type: web
    name: imobiliario-luanda
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Juiz com IA (opcional): sem chave decide o juiz de regras (offline). Modelo por defeito: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JUDGE_MODEL
        sync: false
      # Chamada de voz em redes móveis/restritas: precisa de TURN. Opção A (recomendada, grátis): Cloudflare Realtime TURN
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
      # Opção B: conta grátis em metered.ca
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
